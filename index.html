<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCESI Postulaciones 2026 GIT</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
        <a href="https://www.scesi.org" target="_blank" rel="noopener noreferrer">
            <img class="header-logo" src="assets/logo_scesi_dark_mode.svg" alt="SCESI Logo">
        </a>
    </header>
    
    <footer class="footer">
      <div class="footer-body">
        <img src="assets/logo_scesi_dark_mode.svg" alt="SCESI Logo" />

        <div>
          <p>Siguenos en:</p>
          <div>
            <a
              class="footer-social-media-link"
              href="https://www.facebook.com/scesi"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Página de Facebook de la SCESI"
            >
              <img
                class="footer-social-media-icon"
                src="assets/facebook.svg"
                alt="Faceebook"
              />
            </a>
            <a
              class="footer-social-media-link"
              href="https://x.com/ScesiU"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Siguenos en X"
            >
              <img
                class="footer-social-media-icon"
                src="assets/x.svg"
                alt="X"
              />
            </a>
            <a
              class="footer-social-media-link"
              href="https://www.instagram.com/scesiumss"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Perfil de Instagram de la SCESI"
            >
              <img
                class="footer-social-media-icon"
                src="assets/instagram.svg"
                alt="Instagram"
              />
            </a>
            <a
              class="footer-social-media-link"
              href="https://www.youtube.com/@scesiUmss"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Canal de Youtube de la SCESI"
            >
              <img
                class="footer-social-media-icon"
                src="assets/youtube.svg"
                alt="Youtube"
              />
            </a>
          </div>
        </div>
      </div>

      <p class="footer-p">Hecho con ❤️ por su Auxi</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
